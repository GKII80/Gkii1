    <circle cx="310" cy="410" r="17"/><path d="M284 465 C284 438 336 438 336 465 Z"/>
    <circle cx="490" cy="410" r="17"/><path d="M464 465 C464 438 516 438 516 465 Z"/>
    <circle cx="560" cy="405" r="18"/><path d="M532 465 C532 435 588 435 588 465 Z"/>
    <circle cx="630" cy="400" r="18"/><path d="M602 465 C602 435 658 435 658 465 Z"/>
  </g>
  <g fill="#0F5132">
