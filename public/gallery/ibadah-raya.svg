<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Dokumentasi Ibadah Raya Minggu Pagi GKII Jemaat Sungai Barang">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF3EC"/>
      <stop offset="100%" stop-color="#F5F9F6"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#DCECE1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgSky)"/>
  <!-- Warm stained-glass arch window backdrop -->
  <path d="M250 470 V215 A150 150 0 0 1 550 215 V470 Z" fill="#FFFFFF" stroke="#B8D4C1" stroke-width="4"/>
  <path d="M272 470 V220 A128 128 0 0 1 528 220 V470 Z" fill="url(#sunBeam)"/>
